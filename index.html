<html lang="en"><head><meta charset="utf-8">

<style>
:root{--paper:#eef1f4;--panel:#fff;--ink:#17202b;--muted:#5d6876;--line:#d5dbe2;--accent:#2a59a8;--accent-soft:#dfe8f7;--hit:#ffe58a;--same:#e9edf2;color-scheme:light;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11161d;--panel:#18202a;--ink:#e4e9ef;--muted:#93a0af;--line:#2b3542;--accent:#7fa6ea;--accent-soft:#1f2d45;--hit:#6b5512;--same:#141b23;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#11161d;--panel:#18202a;--ink:#e4e9ef;--muted:#93a0af;--line:#2b3542;--accent:#7fa6ea;--accent-soft:#1f2d45;--hit:#6b5512;--same:#141b23;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr,200px))}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:16px;flex-wrap:wrap}
h1{margin:0;font-stretch:72%;font-weight:800;font-size:clamp(26px,5vw,38px);letter-spacing:-.01em;line-height:1}
h1 small{display:block;font-stretch:100%;font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0;margin-top:6px}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.tab{white-space:nowrap;flex:none;font:inherit;font-weight:600;font-stretch:85%;font-size:17px;padding:8px 16px 10px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--line)}
.tab span{font-weight:400;font-size:13px;margin-left:6px;color:var(--muted)}
.bar{background:var(--paper);border-top:1px solid var(--line);padding:12px 0}
.search{display:flex;gap:10px;align-items:center}
.search input{flex:1;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:0}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
.jumpwrap{display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.jump{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.jump:empty,.jumpwrap:has(.jump:empty){display:none}
.jump button{font:inherit;font-size:13px;white-space:nowrap;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer}
.jump button:hover,.jump button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.jump button i{font-style:normal;color:var(--muted);margin-left:5px;font-size:12px}
.jump button.empty{opacity:.35;cursor:default}
main{padding:20px 0 60px}
section.cat{margin-bottom:28px}
section.cat h2{font-stretch:75%;font-weight:750;font-size:24px;margin:0 0 8px;display:flex;align-items:baseline;gap:10px}
section.cat h2 span{font-stretch:100%;font-weight:400;font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
td{padding:6px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--accent-soft)}
td.s{color:var(--muted);width:24%}
td.n{font-weight:600}
mark{background:var(--hit);color:inherit;border-radius:2px}
.none{padding:40px 0;color:var(--muted);text-align:center}
.hidden{display:none!important}
.totop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.opts{display:none;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.opts.on{display:flex}.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.legend{display:flex;gap:6px;align-items:center}.sw{width:14px;height:14px;border-radius:3px;background:var(--same);border:1px solid var(--line)}
tr.same td{background:var(--same);color:var(--muted)}
td.num,th.num{text-align:right;width:56px;color:var(--muted)}
td.mk,th.mk{text-align:center;width:72px}
.notes{font-size:13px;color:var(--muted);max-width:70ch;margin:0 0 24px}
.notes p{margin:4px 0}
.kitlink{font:inherit;font-weight:600;color:var(--accent);background:none;border:none;padding:0;cursor:pointer;text-align:left}
.kitlink:hover,.kitlink:focus-visible{text-decoration:underline;outline:none}
.revo{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
.flag{color:var(--accent);margin-left:3px;cursor:help}
td.st{width:40%}
footer{color:var(--muted);font-size:12px;padding:0 0 30px}
@media (max-width:600px){table{font-size:14px}td.s{font-size:12px;width:20%!important}td.num,th.num{width:auto;padding-left:6px;padding-right:6px}.tab{font-size:15px;padding:7px 10px 9px}.tab span{display:none}td.s{width:30%}td,th{padding-left:8px;padding-right:8px}.hm{display:none}}

document.getElementById('nv').textContent=D.voices.length;
document.getElementById('ns').textContent=D.styles.length;
document.getElementById('nk').textContent=D.kits.length;
let cur='voices';const qs={voices:'',styles:'',kits:'',pads:'',playlist:''};let hideSame=false;
const main=document.getElementById('main'),jump=document.getElementById('jump'),q=document.getElementById('q'),cnt=document.getElementById('cnt'),opts=document.getElementById('opts');
const kitNotes=`<div class="notes"><p><strong>Alt Group:</strong> playing a sound stops any other sound in the same group (1–95). Groups 96–127 are instead stopped by the group 32 lower, e.g. 96 is stopped by 64.</p><p><strong>Note Off ●:</strong> the sound stops as soon as the key is released.</p><p><strong>Revo! ●:</strong> repeated hits on the key vary, for a more natural sound.</p><p>Notes without a sound are not listed.</p></div>`;
function kitOverview(){
 const rows=D.kits.map((k,i)=>{const [m,l,p]=k[1].split('-');const rv=k[2].filter(r=>r[6]).length;
  return `<tr><td class="n"><button class="kitlink" data-id="kits-${i}">${esc(k[0])}</button></td><td class="num">${m}</td><td class="num">${l}</td><td class="num">${p}</td><td class="num hm">${k[2].length}</td><td>${rv?`<span class="revo">Revo! ${rv}</span>`:''}</td></tr>`}).join('');
 const nr=D.kits.filter(k=>k[2].some(r=>r[6])).length;
 return `<section class="cat" id="kits-list"><h2>Kit list<span>${D.kits.length} kits, ${nr} with Revo! sounds</span></h2><div class="tw"><table><thead><tr><th class="n">Kit</th><th class="num">MSB</th><th class="num">LSB</th><th class="num">PC</th><th class="num hm">Sounds</th><th>Revo!</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
const plNotes=`<div class="notes"><p>From Yamaha’s official Genos2 Playlist files: one Registration per song, with the style it uses. Where Yamaha’s entries ran words together or shortened a style name to fit, they have been spaced out or completed. ‡ marks the few style names that could not be matched to a Genos2 style.</p></div>`;
function render(){
 const c=cfg[cur],term=qs[cur].trim().toLowerCase(),parts=term.split(/\s+/).filter(Boolean);
 const res=parts.map(p=>new RegExp('('+esc(p).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'));
 const hl=s=>{let out=esc(s);res.forEach(re=>{out=out.replace(re,'<mark>$1</mark>')});return out};
 let html=c.kitMode?(parts.length?'':kitOverview())+kitNotes:(cur==='playlist'?plNotes:''),jumps=c.kitMode&&!parts.length?[['kits-list','Kit list',D.kits.length]]:[],total=0,all=0;
 c.groups.forEach((g,i)=>{
  const id=cur+'-'+i;
  let rows=g.rows;
  if(c.kitMode&&hideSame&&g.name!=='StandardKit')rows=rows.filter(r=>!r.same);
  all+=rows.length;
  const nameHit=c.kitMode&&parts.length&&parts.every(p=>g.name.toLowerCase().includes(p));
  const f=parts.length&&!nameHit?rows.filter(r=>{const t=r.c.join(' ').toLowerCase();return parts.every(p=>t.includes(p))}):rows;
  total+=f.length;jumps.push([id,g.name,f.length]);
  if(!f.length)return;
  html+=`<section class="cat" id="${id}"><h2>${hl(g.name)}<span>${g.meta?esc(g.meta)+', ':''}${f.length}${f.length!==g.rows.length?' of '+g.rows.length:''}</span></h2><div class="tw"><table><thead><tr>${c.cols.map(([h,k])=>`<th class="${k}">${h}</th>`).join('')}</tr></thead><tbody>`+
   f.map(r=>`<tr${r.same?' class="same"':''}>`+r.c.map((v,j)=>`<td class="${c.cols[j][1]}">${hl(v??'')}${r.flag&&j===1?'<sup class="flag" title="As written in Yamaha’s playlist file; not an exact Genos2 style name">‡</sup>':''}</td>`).join('')+'</tr>').join('')+'</tbody></table></div></section>';
 });
 if(!total)html=(c.kitMode?kitNotes:'')+`<p class="none">No ${c.noun} match “${esc(qs[cur])}”. Clear the filter to see all.</p>`;
 main.innerHTML=html;
 jump.innerHTML=c.kitMode?"":jumps.map(([id,n,k])=>`<button data-id="${id}" class="${k?'':'empty'}" ${k?'':'disabled'}>${esc(n)}<i>${k}</i></button>`).join('');
 setHdr();
 opts.classList.toggle('on',!!c.kitMode);
 cnt.textContent=parts.length?`${total} of ${all} ${c.noun}`:`${all} ${c.noun}`;
 setHdr();
}
function setTab(t,push){
 cur=t;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
 q.value=qs[t];q.placeholder=cfg[t].ph;render();window.scrollTo(0,0);
 if(push&&location.hash!=='#'+t){try{history.replaceState(null,'','#'+t)}catch(e){}}
}
function setHdr(){document.documentElement.style.setProperty('--hdr',(document.getElementById('hdr').offsetHeight+12)+'px')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab,true));
document.getElementById('hideSame').onchange=e=>{hideSame=e.target.checked;render()};
main.addEventListener('click',e=>{const b=e.target.closest('.kitlink');if(b)document.getElementById(b.dataset.id)?.scrollIntoView()});
const go=id=>document.getElementById(id)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
jump.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;go(b.dataset.id)};
let tm;q.oninput=()=>{qs[cur]=q.value;clearTimeout(tm);tm=setTimeout(render,150)};
q.onkeydown=e=>{if(e.key==='Escape'){q.value='';qs[cur]='';render()}};
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
document.getElementById('totop').onclick=()=>window.scrollTo({top:0});
window.addEventListener('resize',setHdr);
const valid=h=>h in cfg;
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(valid(h)&&h!==cur)setTab(h,false)});
const h0=location.hash.slice(1);setTab(valid(h0)?h0:'voices',false);
</script></body></html>
